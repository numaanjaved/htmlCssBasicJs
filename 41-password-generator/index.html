<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="style.css" />
    <title>Password Generator</title>
  </head>
  <body>
    <div class="container">
      <h1>Password generator</h1>
      <div class="input-box">
        <input type="text" id="passbox" disabled />
      </div>
      <div class="row">
        <label class="password">Password length</label>
        <input type="number" min="1" max="20" value="20" id="limitNumber" />
      </div>
      <div class="row">
        <label class="password">Lowercase letters</label>
        <input type="checkbox" id="lowercase" checked/>
      </div>
      <div class="row">
        <label class="password">Uppercase letters</label>
        <input type="checkbox" id="uppercase" checked/>
      </div>
      <div class="row">
        <label class="password">Number letters</label>
        <input type="checkbox" id="number" checked/>
      </div>
      <div class="row">
        <label class="password">Symbol letters</label>
        <input type="checkbox" id="symbol" checked/>
      </div>
      <button id="genPassword">Generate Password</button>
    </div>
    <script src="scritp.js"></script>
  </body>
</html>
