<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="style.css" />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css"
      integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw=="
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
    />
    <title>Animated Counter</title>
  </head>
  <body>
    <header>
      <div class="container">
        <h1>Animated Counter</h1>
      </div>
    </header>
    <div class="counters">
      <div class="container">
        <div>
          <i class="fa-brands fa-youtube fa-4x"></i>
          <div class="counter" data-target="60000">0</div>
          <h2>Subscribers</h2>
        </div>
        <div>
          <i class="fa-brands fa-twitter fa-4x"></i>
          <div class="counter" data-target="15000">0</div>
          <h2>Followers</h2>
        </div>
        <div>
          <i class="fa-brands fa-facebook fa-4x"></i>
          <div class="counter" data-target="9000">0</div>
          <h2>Likes</h2>
        </div>
        <div>
          <i class="fa-brands fa-linkedin fa-4x"></i>
          <div class="counter" data-target="5000">0</div>
          <h2>Connections</h2>
        </div>
      </div>
    </div>
    <script src="script.js"></script>
  </body>
</html>
