<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css"
      integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw=="
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
    />
    <link rel="stylesheet" href="style.css" />
    <title>Zipcode App</title>
  </head>
  <body>
    <div class="container">
      <h1>US Location Info</h1>
      <p>Enter a zipcode to get the location info</p>
      <form>
        <input type="text" class="zip" placeholder="Enter zipcode" />
      </form>
        <span><i class="fa-solid fa-check icon-check"></i></span>
        <span><i class="fa-solid fa-xmark icon-remove"></i></span>
    </div>
    <div class="output"></div>
    <script src="script.js"></script>
  </body>
</html>
