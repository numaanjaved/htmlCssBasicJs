<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
      crossorigin="anonymous"
    />
    <title>Fetch API Introduction</title>
  </head>
  <body>
    <div class="container">
      <h1 class="display-4 mb-4">Fetch API Sandbox</h1>
      <button class="btn btn-primary" id="getText">Get Text</button>
      <button class="btn btn-primary" id="getUsers">Get Users</button>
      <button class="btn btn-primary" id="getPosts">Get Posts</button>
      <hr />
      <div id="output"></div>
      <form class="form-group" id="Post">
        <div>
          <input
            type="text"
            id="title"
            placeholder="title"
            class="form-control mb-1"
          />
        </div>
        <div>
          <textarea
            id="body"
            placeholder="body"
            class="form-control"
          ></textarea>
        </div>
        <input type="submit" value="submit" class="btn btn-primary mt-1" />
      </form>
    </div>
    <script src="script.js"></script>
  </body>
</html>
