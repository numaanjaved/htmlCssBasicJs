<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
      crossorigin="anonymous"
    />
    <title>Fetch API Introduction</title>
  </head>
  <body>
    <div class="container">
      <h1 class="display-4 mb-4">Fetch API Sandbox</h1>
      <button class="btn btn-primary" id="getText">Get Text</button>
      <button class="btn btn-primary" id="getUsers">Get Users</button>
      <button class="btn btn-primary" id="getPosts">Get Posts</button>
      <hr />
      <div id="output"></div>
      <form class="form-group" id="Post">
        <div>
          <input
            type="text"
            id="title"
            placeholder="title"
            class="form-control mb-1"
          />
        </div>
        <div>
          <textarea
            id="body"
            placeholder="body"
            class="form-control"
          ></textarea>
        </div>
        <input type="submit" value="submit" class="btn btn-primary mt-1" />
      </form>
    </div>
    <script>
      document.querySelector("#getText").addEventListener("click", getText);
      document.querySelector("#getUsers").addEventListener("click", getUsers);
      document.querySelector("#getPosts").addEventListener("click", getPosts);
      document.querySelector("#Post").addEventListener("submit", addPost);
      function getText() {
        fetch("sample.txt")
          .then(function (res) {
            return res.text();
          })
          .then(function (data) {
            document.querySelector("#output").innerHTML = data;
          })
          .catch(function (err) {
            console.log(err);
          });
      }

      function getUsers() {
        fetch("users.json")
          .then((res) => res.json())
          .then((data) => {
            let output = "<h2>Users</h2>";
            data.forEach(function (user) {
              output += `<div>
                    <ul>
                        <li>${user.id}</li>
                        <li>${user.name}</li>
                        <li>${user.email}</li>
                        </ul>
                    </div>`;
            });
            document.querySelector("#output").innerHTML = output;
          });
      }

      function getPosts() {
        fetch("https://jsonplaceholder.typicode.com/posts")
          .then((res) => res.json())
          .then((data) => {
            let output = "<h2>Posts</h2>";
            data.forEach(function (post) {
              output += `<div>
                        <h2>${post.title}</h2>
                        <p>${post.body}</p>
                    </div>`;
            });
            document.querySelector("#output").innerHTML = output;
          });
      }

      function addPost(e) {
        e.preventDefault();
        let title = document.querySelector("#title").value;
        let body = document.querySelector("#body").value;
        fetch("https://jsonplaceholder.typicode.com/posts", {
          method: "POST",
          headers: {
            Accept: "application/json,text/plain,*/*",
            "Content-type": "application/json",
          },
          body: JSON.stringify({ title: title, body: body }),
        })
          .then((res) => res.json())
          .then((data) => console.log(data));
      }
    </script>
  </body>
</html>
