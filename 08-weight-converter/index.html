<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="style.css" />
    <title>Weight converter</title>
  </head>
  <body>
    <section class="container">
      <h1>Weight Converter</h1>
      <input type="number" id="pound" placeholder="enter pound"/>
      <div class="card">
        <h2>Gram</h2>
        <p class="gramOutput"></p>
      </div>
      <div class="card-2">
        <h2>Kilogram</h2>
        <p class="kgOutput"></p>
      </div>
    </section>
    <script src="script.js"></script>
  </body>
</html>
