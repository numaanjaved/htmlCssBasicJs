<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="style.css" />
    <title>Javascript dom final project</title>
  </head>
  <body>
    <header id="main-header">
      <h1 class="title">Item Lister</h1>
      <div class="search">
        <input type="search" class="filter" />
      </div>
    </header>
    <section class="container">
      <div class="content-top">
        <h2 class="title">Add items</h2>
        <form class="input-form">
          <input type="text" class="text" />
          <input type="button" value="Submit" class="btn" />
        </form>
        <ul class="items">
          <li class="listed-group-item">
            Item 1 <button class="delete">X</button>
          </li>
          <li class="listed-group-item">
            Item 2 <button class="delete">X</button>
          </li>
          <li class="listed-group-item">
            Item 3 <button class="delete">X</button>
          </li>
          <li class="listed-group-item">
            Item 4 <button class="delete">X</button>
          </li>
        </ul>
      </div>
    </section>
    <script src="script.js"></script>
  </body>
</html>
