<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Ajax crash course</title>
  </head>
  <body>
    <button id="user">user</button>
    <h1>user</h1>
    <div class="output"></div>
    <button id="users">users</button>
    <h1>users</h1>
    <div class="outputs"></div>

    <script>
      document.querySelector("#user").addEventListener("click", loadtext);
      document.querySelector("#users").addEventListener("click", loadtexts);
      function loadtext() {
        var xhr = new XMLHttpRequest();
        xhr.open("GET", "user.json", true);
        xhr.onload = function () {
          if (this.status == 200) {
            var user = JSON.parse(this.responseText);
            var output = "";
            output +=
              "<ul>" +
              "<li>" +
              user.id +
              "</li>" +
              "<li>" +
              user.name +
              "</li>" +
              "<li>" +
              user.email +
              "</li>" +
              "</ul>";
          }
          document.querySelector(".output").innerHTML = output;
        };
        xhr.send();
      }

      function loadtexts() {
        var xhr = new XMLHttpRequest();
        xhr.open("GET", "users.json", true);
        xhr.onload = function () {
          if (this.status == 200) {
            var users = JSON.parse(this.responseText);
            var output = "";
            for (var i in users) {
              output +=
                "<ul>" +
                "<li>" +
                users[i].id +
                "</li>" +
                "<li>" +
                users[i].name +
                "</li>" +
                "<li>" +
                users[i].email +
                "</li>" +
                "</ul>";
            }
          }
          document.querySelector(".outputs").innerHTML = output;
        };
        xhr.send();
      }
    </script>
  </body>
</html>
