  <head>

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="style.css" />
    <title>Ajax crash course</title>
  </head>
  <body>
    <!-- Get text file -->
    <button id="text">Get text file</button>
    <p class="text"></p>
    <div class="container">
      <div class="cont1">
        <!-- get user -->
        <button id="user">user</button>
        <h1>user</h1>
        <div class="user"></div>
      </div>
      <div class="cont2">
        <!-- Get Users -->
        <button id="users">users</button>
        <h1>users</h1>
        <div class="users"></div>
      </div>
      <div class="cont3">
        <!-- Get GitHub users -->
        <button id="gitUser">Load github user</button>
        <h1>Github user</h1>
        <div class="gitUser"></div>
      </div>
    </div>
    <script src="script.js"></script>
  </body>
</html>
