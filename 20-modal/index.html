<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="style.css" />
    <title>Simple Modal</title>
  </head>
  <body>
    <button id="modalBtn" class="button">Click here</button>
    <div id="simpleModal" class="modal">
      <div class="modal-content">
        <div class="header">
          <h1>Header</h1>
          <span id="closeBtn">&times;</span>
        </div>
        <div class="body">
          <p>Hello... I am a modal</p>
          <p>
            Lorem ipsum dolor sit amet consectetur adipisicing elit. Enim minima
            consequuntur asperiores qui architecto repudiandae placeat quidem
            ducimus, veniam esse earum quaerat cum obcaecati, tempora nostrum
            itaque! Ea, repudiandae illo!
          </p>
        </div>
        <div class="footer">
          <h2>Footer</h2>
        </div>
      </div>
    </div>
    <script src="script.js"></script>
  </body>
</html>
