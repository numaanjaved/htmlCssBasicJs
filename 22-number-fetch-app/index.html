<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="style.css" />
    <title>Number Fetch App</title>
  </head>
  <body>
    <div class="container">
      <div class="content">
        <h1>Number Fetch App</h1>
        <input
          type="number"
          class="numberFact"
          id="numFacts"
          placeholder="Enter number"
        />
        <div class="facts">
          <h2>Number Facts</h2>
          <p class="fact"></p>
        </div>
      </div>
    </div>
    <script src="script.js"></script>
  </body>
</html>
